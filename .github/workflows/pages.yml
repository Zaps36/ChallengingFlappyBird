name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cek sintaks semua modul
        run: |
          for f in src/*.js src/entities/*.js; do
            node --check "$f" || exit 1
          done
      - name: Jalankan smoke test
        run: node tools/smoke.mjs

  deploy:
    name: Deploy
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # PENTING (sekali saja): aktifkan dulu di
      # Settings -> Pages -> Source: "GitHub Actions".
      # GITHUB_TOKEN tidak punya izin membuat situs Pages sendiri, jadi job ini
      # akan gagal sampai langkah manual di atas dilakukan.
      - uses: actions/configure-pages@v5
      - name: Upload artifact (situs statis = root repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
